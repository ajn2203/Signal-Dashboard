<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Health Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header>
    <h1>Health Dashboard</h1>
    <div id="lastUpdated" class="muted"></div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="health">Health Metrics</button>
    <button class="tab-btn" data-tab="symptoms">Symptoms</button>
    <button class="tab-btn" data-tab="mood">Mood</button>
  </nav>

  <main>
    <section id="overview" class="tab-panel active">
      <div class="card-grid" id="summaryCards"></div>
      <div class="chart-card">
        <h3>Sleep (hrs) — Last 30 Days</h3>
        <canvas id="sleepChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Resting Heart Rate — Last 30 Days</h3>
        <canvas id="hrChart"></canvas>
      </div>
    </section>

    <section id="health" class="tab-panel">
      <div class="controls">
        <label>Metric:
          <select id="metricSelect"></select>
        </label>
      </div>
      <div class="chart-card">
        <canvas id="metricChart"></canvas>
      </div>
      <div class="table-wrap">
        <table id="healthTable"></table>
      </div>
    </section>

    <section id="symptoms" class="tab-panel">
      <div class="table-wrap">
        <table id="symptomsTable"></table>
      </div>
    </section>

    <section id="mood" class="tab-panel">
      <div class="chart-card">
        <h3>Mood Valence Over Time</h3>
        <canvas id="moodChart"></canvas>
      </div>
      <div class="table-wrap">
        <table id="moodTable"></table>
      </div>
    </section>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
